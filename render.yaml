databases:
  - name: blood_pressure
    databaseName: blood_pressure
    user: blood_pressure_user
    plan: free

services:
  - type: web
    name: blood-pressure-app-qclaw
    env: python
    region: oregon
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python -m gunicorn app:app --bind 0.0.0.0:$PORT --workers 1 --timeout 120
    healthCheckPath: /health
    envVars:
      - key: PGHOST
        fromDatabase:
          name: blood_pressure
          attribute: host
      - key: PGDATABASE
        fromDatabase:
          name: blood_pressure
          attribute: database
      - key: PGUSER
        fromDatabase:
          name: blood_pressure
          attribute: user
      - key: PGPASSWORD
        fromDatabase:
          name: blood_pressure
          attribute: password
      - key: SECRET_KEY
        generateValue: true
      - key: PORT
        value: 10000
